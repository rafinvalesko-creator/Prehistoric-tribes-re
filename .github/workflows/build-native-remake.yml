name: Build native Android remake

on:
  workflow_dispatch:
  push:
    branches: [native-android-remake]
    paths:
      - "native-remake/**"
      - ".github/workflows/build-native-remake.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p native-remake :app:assembleDebug
      - name: Verify APK
        run: |
          test -s native-remake/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging native-remake/app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|launchable-activity:"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-tribes-native-prototype
          path: native-remake/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
