name: Clean-room Android build
on:
  workflow_dispatch:
  push:
    branches: [ clean-room-android-engine ]
    paths:
      - 'new-engine/**'
      - '.github/workflows/clean-room-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Build APK
        run: gradle -p new-engine :game:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tribal-age-clean-room-debug
          path: new-engine/game/build/outputs/apk/debug/game-debug.apk
          if-no-files-found: error
