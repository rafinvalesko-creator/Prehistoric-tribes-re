name: Clean-room Android build
on:
  workflow_dispatch:
  push:
    branches: [ clean-room-android-engine ]
    paths:
      - 'new-engine/**'
      - '.github/workflows/clean-room-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses && sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p new-engine :game:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tribal-age-clean-room-debug
          path: new-engine/game/build/outputs/apk/debug/game-debug.apk
          if-no-files-found: error
