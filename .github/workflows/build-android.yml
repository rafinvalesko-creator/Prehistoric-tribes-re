name: Build Prehistoric Tribes Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trigger-build.txt'
      - '.github/workflows/trigger-build-2.txt'
      - '.github/workflows/trigger-build-3.txt'
      - '.github/workflows/trigger-build-4.txt'
      - '.github/workflows/trigger-build-5.txt'
      - '.github/workflows/trigger-build-6.txt'
      - '.github/workflows/trigger-build-7.txt'
      - '.github/workflows/trigger-build-8.txt'
      - '.github/workflows/trigger-build-9.txt'
      - '.github/workflows/trigger-build-10.txt'
      - '.github/workflows/trigger-build-11.txt'
      - '.github/workflows/trigger-build-12.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4

      - name: Check out JL-Mod runtime
        uses: actions/checkout@v4
        with:
          repository: woesss/JL-Mod
          ref: dev
          path: jlmod
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: jlmod/**/*.gradle*

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;22.1.7171670"

      - name: Prepare MIDlet source and resources
        shell: bash
        run: |
          set -euo pipefail
          test -f original/prehistoric-tribes-0.1.38.jar
          mkdir -p jlmod/app/src/midlet/java jlmod/app/src/midlet/resources/MIDLET-META-INF
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res -d decompiled-jadx original/prehistoric-tribes-0.1.38.jar
          cp -a decompiled-jadx/sources/. jlmod/app/src/midlet/java/
          # Repair known JADX type-inference and name-shadowing errors using the original bytecode structure.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('jlmod/app/src/midlet/java/defpackage')
          p = root / 'f.java'
          s = p.read_text()
          s = s.replace('this.a.f243b = new short[11];', 'this.a.f243b = new short[11][];')
          s = s.replace('this.a.f244j = new byte[25];', 'this.a.f244j = new byte[25][];')
          s = s.replace('this.a.f242a = new Image[3];', 'this.a.f242a = new Image[3][];')
          p.write_text(s)
          p = root / 'g.java'
          s = p.read_text()
          s = s.replace('this.f245b = new int[]{new int[]{', 'this.f245b = new int[][]{new int[]{')
          s = s.replace('Object[] objArr = false;', 'boolean objArr = false;')
          s = s.replace('                } else {\n                    return;\n                }\n                break;\n            case 1055:', '                } else {\n                    return;\n                }\n            case 1055:')
          s = s.replace('                    b6 = (byte) (b7 + 1);\n                }\n            }\n            b4 =', '                    b6 = (byte) (b7 + 1);\n                } else {\n                    break;\n                }\n            }\n            b4 =')
          s = s.replace('                    b10 = (byte) (b11 + 1);\n                }\n            }\n            b8 =', '                    b10 = (byte) (b11 + 1);\n                } else {\n                    break;\n                }\n            }\n            b8 =')
          s = s.replace('                    b16 = (byte) (b17 + 1);\n                }\n            }\n            b12 =', '                    b16 = (byte) (b17 + 1);\n                } else {\n                    break;\n                }\n            }\n            b12 =')
          s = s.replace('        if (recordStoreOpenRecordStore != null) {\n            recordStoreOpenRecordStore.closeRecordStore();\n        }', '        if (recordStoreOpenRecordStore != null) {\n            try { recordStoreOpenRecordStore.closeRecordStore(); } catch (Exception ignored) { }\n        }')
          s = s.replace('            this.f150a = new a("audio/midi");', '            try { this.f150a = new a("audio/midi"); } catch (Exception ignored) { this.f150a = null; }')
          p.write_text(s)
          p = root / 'd.java'
          s = p.read_text().replace('g.', 'defpackage.g.')
          s = s.replace('Strindefpackage.g.valueOf', 'String.valueOf')
          p.write_text(s)
          p = root / 'b.java'
          s = p.read_text()
          s = s.replace('this.f0a = Connector.open(this.c);', 'this.f0a = (MessageConnection) Connector.open(this.c);')
          s = s.replace('TextMessage textMessageNewMessage = this.f0a.newMessage("text");', 'TextMessage textMessageNewMessage = (TextMessage) this.f0a.newMessage("text");')
          p.write_text(s)
          p = root / 'c.java'
          s = p.read_text()
          old = """                        if (this.f49v <= 30) {
                            if (this.a.f272G || this.f4a[8505 + this.f49v] <= 0 || this.f4a[8749 + this.f49v] != this.f7b[this.f8a[297] + this.f31g]) {
                                this.f49v++;
                            } else {
                                this.f80O = (byte) (120 - this.f7b[this.f8a[298] + this.f31g]);
                            }
                        }
                    }
                    if (this.f80O < 120 - this.f7b[this.f8a[298] + this.f31g]) {"""
          new = """                        if (this.f49v <= 30) {
                            if (this.a.f272G || this.f4a[8505 + this.f49v] <= 0 || this.f4a[8749 + this.f49v] != this.f7b[this.f8a[297] + this.f31g]) {
                                this.f49v++;
                            } else {
                                this.f80O = (byte) (120 - this.f7b[this.f8a[298] + this.f31g]);
                                break;
                            }
                        } else {
                            break;
                        }
                    }
                    if (this.f80O < 120 - this.f7b[this.f8a[298] + this.f31g]) {"""
          if old not in s:
              raise SystemExit('Expected c.java loop not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          test -n "$(find jlmod/app/src/midlet/java -type f -name '*.java' -print -quit)"
          unzip -oq original/prehistoric-tribes-0.1.38.jar -d /tmp/prehistoric-jar
          chmod -R u+rwX /tmp/prehistoric-jar
          cp -a /tmp/prehistoric-jar/. jlmod/app/src/midlet/resources/
          find jlmod/app/src/midlet/resources -type f -name '*.class' -delete
          rm -rf jlmod/app/src/midlet/resources/META-INF
          if [ -f /tmp/prehistoric-jar/META-INF/MANIFEST.MF ]; then
            cp /tmp/prehistoric-jar/META-INF/MANIFEST.MF jlmod/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          else
            echo "Original MIDlet manifest is missing" >&2
            exit 1
          fi
          sed -i 's/^MIDlet-Name:.*/MIDlet-Name: Prehistoric Tribes/' jlmod/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          sed -i 's/^MIDlet-1:.*/MIDlet-1: Prehistoric Tribes, , tribes/' jlmod/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          sed -i 's/^MIDlet-Version:.*/MIDlet-Version: 0.1.38/' jlmod/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          echo "MIDlet source files: $(find jlmod/app/src/midlet/java -name '*.java' | wc -l)"
          echo "Resource files: $(find jlmod/app/src/midlet/resources -type f | wc -l)"
          cat jlmod/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF

      - name: Set application project name
        run: sed -i 's/rootProject.name = "JL-Mod"/rootProject.name = "Prehistoric-Tribes"/' jlmod/settings.gradle.kts

      - name: Build MIDlet debug APK
        working-directory: jlmod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleMidletDebug

      - name: Save decompiled sources for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-tribes-decompiled-sources
          path: jlmod/app/src/midlet/java/**/*.java
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-tribes-android-debug
          path: jlmod/app/build/outputs/apk/midlet/debug/*.apk
          if-no-files-found: error
