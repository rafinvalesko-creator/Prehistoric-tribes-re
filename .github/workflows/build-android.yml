name: Build Prehistoric Tribes standalone Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/workflows/trigger-build-13.txt'
      - '.github/workflows/trigger-build-14.txt'
      - 'original/prehistoric-tribes-0.1.38.jar'
      - 'tools/JarTouchPatcher.java'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4

      - name: Check out JL-Mod runtime
        uses: actions/checkout@v4
        with:
          repository: woesss/JL-Mod
          ref: dev
          path: jlmod
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: jlmod/**/*.gradle*

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;22.1.7171670"

      - name: Prepare embedded original game and launcher
        shell: bash
        run: |
          set -euo pipefail
          test -f original/prehistoric-tribes-0.1.38.jar
          python3 -m compileall -q tools
          mkdir -p jlmod/app/src/main/assets jlmod/app/src/main/java/ru/playsoftware/j2meloader
          cp original/prehistoric-tribes-0.1.38.jar jlmod/app/src/main/assets/prehistoric-tribes-0.1.38.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o /tmp/asm-9.7.1.jar
          javac -cp /tmp/asm-9.7.1.jar -d /tmp tools/JarTouchPatcher.java
          java -cp /tmp:/tmp/asm-9.7.1.jar JarTouchPatcher \
            jlmod/app/src/main/assets/prehistoric-tribes-0.1.38.jar \
            /tmp/prehistoric-tribes-touch.jar
          mv /tmp/prehistoric-tribes-touch.jar jlmod/app/src/main/assets/prehistoric-tribes-0.1.38.jar
          # Bytecode-level regression check: the battlefield renderer must no longer call
          # the hand/cursor sprite routine from either branch of g.d(int,int).
          javap -classpath jlmod/app/src/main/assets/prehistoric-tribes-0.1.38.jar -c -p g > /tmp/patched-game.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("/tmp/patched-game.txt").read_text()
          match = re.search(r"private void d\(int, int\);(.*?)(?=^  (?:public|private|protected) |\Z)", text, re.M | re.S)
          if not match:
              raise SystemExit("Could not locate battlefield renderer g.d(int,int)")
          if "Method d:(IIII)V" in match.group(1):
              raise SystemExit("Hand cursor draw call remains in battlefield renderer")
          if "pointerPressed(int, int)" not in text or "pointerReleased(int, int)" not in text:
              raise SystemExit("Direct touch handlers are missing from patched game class")
          print("Verified: battlefield hand cursor calls removed; direct touch handlers present")
          PY
          cat > jlmod/app/src/main/java/ru/playsoftware/j2meloader/BundledGameActivity.java <<'JAVA'
          package ru.playsoftware.j2meloader;

          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.lifecycle.ViewModelProvider;
          import androidx.preference.PreferenceManager;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          import ru.playsoftware.j2meloader.applist.AppListModel;
          import ru.playsoftware.j2meloader.config.Config;
          import ru.playsoftware.j2meloader.config.ProfileModel;
          import ru.playsoftware.j2meloader.config.ProfilesManager;
          import ru.playsoftware.j2meloader.util.Constants;
          import ru.playsoftware.j2meloader.util.FileUtils;
          import ru.woesss.j2me.installer.InstallerDialog;

          public final class BundledGameActivity extends AppCompatActivity {
              private static final String GAME_NAME = "Prehistoric Tribes";
              private static final String GAME_DIR = "Prehistoric Tribes";
              private static final String JAR_ASSET = "prehistoric-tribes-0.1.38.jar";
              private static final String PATCH_VERSION = "direct-touch-v3";
              private File workDir;

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setText("Запуск «Первобытные войны»...");
                  setContentView(status);

                  File externalFiles = getExternalFilesDir(null);
                  if (externalFiles == null) {
                      status.setText("Память приложения недоступна.");
                      return;
                  }

                  workDir = new File(externalFiles, "game-runtime");
                  PreferenceManager.getDefaultSharedPreferences(this).edit()
                          .putString(Constants.PREF_EMULATOR_DIR, workDir.getAbsolutePath())
                          .apply();

                  if (!FileUtils.initWorkDir(workDir)) {
                      status.setText("Не удалось создать папку игры.");
                      return;
                  }

                  AppListModel appListModel = new ViewModelProvider(this).get(AppListModel.class);
                  appListModel.setEmulatorDirectory(workDir.getAbsolutePath());

                  try {
                      ensureDefaultProfile();
                      launchOrInstall();
                  } catch (Exception e) {
                      status.setText("Ошибка подготовки игры: " + e.getMessage());
                  }
              }

              private void ensureDefaultProfile() throws IOException {
                  enforceGameProfile();
              }

              // Public so the installer can enforce the same settings immediately before launch.
              public static void enforceGameProfile() throws IOException {
                  File profileDir = new File(Config.getConfigsDir(), GAME_DIR);
                  if (!profileDir.isDirectory() && !profileDir.mkdirs()) {
                      throw new IOException("Не удалось создать настройки игры");
                  }
                  ProfileModel profile = new ProfileModel(profileDir);
                  profile.orientation = 3; // landscape in JL-Mod
                  profile.screenWidth = 320;
                  profile.screenHeight = 240;
                  profile.screenScaleType = 1; // preserve the landscape 4:3 game image
                  profile.screenScaleToFit = true;
                  profile.screenKeepAspectRatio = true;
                  profile.forceFullscreen = true;
                  profile.touchInput = true;
                  profile.showKeyboard = false;
                  if (!ProfilesManager.saveConfig(profile)) {
                      throw new IOException("Не удалось сохранить настройки прямого сенсорного управления");
                  }
              }

              private void launchOrInstall() throws IOException {
                  File appDir = new File(Config.getAppDir(), GAME_DIR);
                  File jar = new File(appDir, "res.jar");
                  File dex = new File(appDir, "converted.zip");
                  File marker = new File(workDir, "touch-patch-version.txt");

                  if (jar.isFile() && dex.isFile() && isCurrentBuild(marker)) {
                      Config.startApp(this, GAME_NAME, appDir.getAbsolutePath());
                      finish();
                      return;
                  }

                  if (appDir.exists()) {
                      FileUtils.deleteDirectory(appDir);
                  }
                  if (marker.exists() && !marker.delete()) {
                      throw new IOException("Не удалось обновить версию сенсорного управления");
                  }

                  File bundledJar = new File(getCacheDir(), JAR_ASSET);
                  try (InputStream input = getAssets().open(JAR_ASSET);
                       FileOutputStream output = new FileOutputStream(bundledJar)) {
                      byte[] buffer = new byte[8192];
                      int read;
                      while ((read = input.read(buffer)) != -1) {
                          output.write(buffer, 0, read);
                      }
                  }

                  status.setText("Первый запуск: установите встроенную игру в открывшемся окне.\nНажмите сюда, если нужно повторить установку.");
                  status.setOnClickListener(v -> showInstaller(bundledJar));
                  showInstaller(bundledJar);
              }

              private boolean isCurrentBuild(File marker) {
                  if (!marker.isFile()) return false;
                  try (java.io.BufferedReader reader = new java.io.BufferedReader(new java.io.FileReader(marker))) {
                      return PATCH_VERSION.equals(reader.readLine());
                  } catch (IOException e) {
                      return false;
                  }
              }

              private void showInstaller(File jar) {
                  if (isFinishing() || getSupportFragmentManager().findFragmentByTag("installer") != null) {
                      return;
                  }
                  InstallerDialog.newInstance(Uri.fromFile(jar))
                          .show(getSupportFragmentManager(), "installer");
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("jlmod")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          old = 'create("emulator") { // variant dimension for create emulator\n            buildConfigField("boolean", "FULL_EMULATOR", "true")'
          new = 'create("emulator") { // variant dimension for create emulator\n            applicationId = "com.prehistorictribes.game"\n            versionName = "0.1.38"\n            buildConfigField("boolean", "FULL_EMULATOR", "true")'
          if old not in s:
              raise SystemExit("JL-Mod emulator flavor block changed; refusing unsafe edit")
          s = s.replace(old, new, 1)
          s = s.replace('resValue("string", "app_name", "JL-Debug")',
                        'resValue("string", "app_name", "Prehistoric Tribes")', 1)
          gradle.write_text(s)

          manifest = root / "app/src/main/AndroidManifest.xml"
          s = manifest.read_text()
          if s.count('android:name=".MainActivity"') != 1:
              raise SystemExit("Expected one MainActivity manifest entry")
          s = s.replace('android:name=".MainActivity"', 'android:name=".BundledGameActivity"', 1)
          s = s.replace('android:name=".BundledGameActivity"', 'android:name=".BundledGameActivity" android:screenOrientation="landscape"', 1)
          s = s.replace('android:name="javax.microedition.shell.MicroActivity"', 'android:name="javax.microedition.shell.MicroActivity" android:screenOrientation="landscape"', 1)
          s = s.replace('    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\n        android:minSdkVersion="30"\n        tools:ignore="ScopedStorage" />\n', '')
          s = s.replace('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\n        android:maxSdkVersion="29" />\n', '')
          manifest.write_text(s)

          installer = root / "app/src/main/java/ru/woesss/j2me/installer/InstallerDialog.java"
          s = installer.read_text()
          pattern = re.compile(r'(?m)^(\s*)Config\.startApp\(v\.getContext\(\), app\.getTitle\(\), app\.getPathExt\(\)\);')
          s, count = pattern.subn(
              lambda m: m.group(1) + 'try { ru.playsoftware.j2meloader.BundledGameActivity.enforceGameProfile(); } catch (java.io.IOException e) { throw new RuntimeException(e); }\n'
                        + m.group(1) + 'try (java.io.FileWriter marker = new java.io.FileWriter(new java.io.File(Config.getEmulatorDir(), "touch-patch-version.txt"))) { marker.write("direct-touch-v3"); } catch (java.io.IOException e) { throw new RuntimeException(e); }\n'
                        + m.group(1) + 'Config.startApp(v.getContext(), app.getTitle(), app.getPathExt());\n'
                        + m.group(1) + 'if (getActivity() != null) getActivity().finish();',
              s
          )
          if count < 1:
              raise SystemExit("Installer success launch hook not found")
          installer.write_text(s)
          PY
          sed -i 's/rootProject.name = "JL-Mod"/rootProject.name = "Prehistoric-Tribes"/' jlmod/settings.gradle.kts
          test -f jlmod/app/src/main/assets/prehistoric-tribes-0.1.38.jar
          test -f jlmod/app/src/main/java/ru/playsoftware/j2meloader/BundledGameActivity.java
          grep -q 'BundledGameActivity' jlmod/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation="landscape"' jlmod/app/src/main/AndroidManifest.xml
          grep -q 'screenWidth = 320' jlmod/app/src/main/java/ru/playsoftware/j2meloader/BundledGameActivity.java
          grep -q 'screenHeight = 240' jlmod/app/src/main/java/ru/playsoftware/j2meloader/BundledGameActivity.java
          grep -q 'BundledGameActivity.enforceGameProfile()' jlmod/app/src/main/java/ru/woesss/j2me/installer/InstallerDialog.java

      - name: Build standalone Android APK
        working-directory: jlmod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleEmulatorDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-tribes-android-debug
          path: jlmod/app/build/outputs/apk/emulator/debug/*.apk
          if-no-files-found: error
